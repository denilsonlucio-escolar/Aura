{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Painel Administrativo - Aura{% endblock %}</title>
  
  <link rel="stylesheet" href="{% static 'assets/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/painel.css' %}">
</head>
<body class="body-privado">

  <div class="layout-privado">
    <aside class="sidebar-privado" aria-label="Menu Lateral do Painel">
      <div class="sidebar-brand"> Aura Admin</div>

      <nav>
        <ul class="sidebar-menu">
          <li>
            <a href="{% url 'painel' %}" class="sidebar-link {% if pagina == 'painel' %}ativo{% endif %}">
              📊 Dashboard (SIG/SAD)
            </a>
          </li>
          <li>
            <a href="{% url 'produtos' %}" class="sidebar-link {% if pagina == 'produtos' %}ativo{% endif %}">
              📦 Gerenciar Produtos
            </a>
          </li>
          <li>
            <a href="{% url 'add_categoria' %}" class="sidebar-link {% if pagina == 'categorias' %}ativo{% endif %}">
              🏷️ Gerenciar Categorias
            </a>
          </li>
          <li>
            <a href="{% url 'usuarios' %}" class="sidebar-link {% if pagina == 'usuarios' %}ativo{% endif %}">
              👥 Gerenciar Usuários
            </a>
          </li>
          
          <li class="sidebar-divider"></li>
          
          <li>
            <a href="{% url 'inicial' %}" class="sidebar-link">🌐 Voltar para a Loja</a>
          </li>
          <li>
            <a href="{% url 'logout' %}" class="sidebar-link logout">🚪 Sair</a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      {% block conteudo %}
      {% endblock %}
    </main>
  </div>

</body>
</html>
