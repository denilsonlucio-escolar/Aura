{% extends 'base.html' %}

{% load static %}

{% block titulo %}Cadastro{% endblock %}

{% block estilo %}
<link rel="stylesheet" href="{% static 'assets/css/cadastro.css' %}">
{% endblock %}

{% block scripts %}
<script src="{% static 'assets/js/cadastro.js' %}"></script>
{% endblock %}

{% block conteudo %}

<main class="container">

    <div class="form-box">

        <form method="POST">
            {% csrf_token %}

            <h1>Criar Cadastro</h1>

            <h2>Dados de acesso</h2>

            <div class="grupo">
                <input type="text" id="username" name="username" placeholder="Usuário" aria-label="Usuário" required>
                <input type="password" id="password" name="password" placeholder="Senha" aria-label="Senha" required>
            </div>

            <h2>Dados pessoais</h2>

            <div class="grupo">
                <input type="text" id="nome" name="nome" placeholder="Nome" aria-label="Nome" required>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" aria-label="Sobrenome" required>
            </div>

            <p class="titulo">Sexo</p>

            <div class="sexo">
                <label>
                    <input type="radio" name="sexo" value="F" aria-label="Feminino">
                    Feminino
                </label>

                <label>
                    <input type="radio" name="sexo" value="M" aria-label="Masculino">
                    Masculino
                </label>
            </div>

            <h2>Informações pessoais</h2>

            <div class="grupo tres">
                <input type="text" id="dia" name="dia" placeholder="Dia" aria-label="Dia de nascimento">
                <input type="text" id="mes" name="mes" placeholder="Mês" aria-label="Mês de nascimento">
                <input type="text" id="ano" name="ano" placeholder="Ano" aria-label="Ano de nascimento">
            </div>

            <div class="grupo">
                <input type="text" id="cpf" name="cpf" placeholder="CPF" aria-label="CPF">
                <input type="text" id="telefone" name="telefone" placeholder="Celular" aria-label="Celular">
            </div>

            <input type="email" id="email" name="email" placeholder="Email" aria-label="Endereço de e-mail">

            <h2>Endereço</h2>

            <div class="grupo">
                <input type="text" id="cep" name="cep" placeholder="CEP" aria-label="CEP">
                <input type="text" id="estado" name="estado" placeholder="Estado" aria-label="Estado">
            </div>

            <div class="grupo">
                <input type="text" id="cidade" name="cidade" placeholder="Cidade" aria-label="Cidade">
                <input type="text" id="bairro" name="bairro" placeholder="Bairro" aria-label="Bairro">
            </div>

            <div class="grupo">
                <input type="text" id="rua" name="rua" placeholder="Rua" aria-label="Rua">
                <input type="text" id="numero" name="numero" placeholder="Número" aria-label="Número">
            </div>

            <input type="text" id="complemento" name="complemento" placeholder="Complemento" aria-label="Complemento">

            <button type="submit">
                Cadastrar
            </button>

        </form>

    </div>

</main>

{% endblock %}
